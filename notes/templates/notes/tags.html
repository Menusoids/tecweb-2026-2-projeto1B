{% extends "notes/base.html" %}

{% block content %}
<h2 class="page-title">Tags</h2>
<div class="tag-list">
  {% for tag in tags %}
  <a class="card-tag" href="{% url 'tag_detail' tag.id %}">#{{ tag.nome }}</a>
  {% empty %}
  <p class="aviso-texto">Nenhuma tag ainda.</p>
  {% endfor %}
</div>
<a class="tags-link" href="{% url 'index' %}">voltar</a>
{% endblock %}
