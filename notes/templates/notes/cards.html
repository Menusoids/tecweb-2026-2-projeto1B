<div class="card-container">
  {% for note in notes %}
  <div class="card">
    <h3 class="card-title">{{ note.title }}</h3>
    <div class="card-content">
      <p>{{ note.content|default:'' }}</p>
    </div>
    <div class="card-actions">
    {% for tag in note.tags.all %}<a class="card-tag" href="{% url 'tag_detail' tag.id %}">#{{ tag.nome }}</a>{% endfor %}
    <a class="card-action" href="{% url 'update' note.id %}">editar</a>
    <a class="card-action" href="{% url 'delete' note.id %}">apagar</a>
  </div>
  </div>
  {% endfor %}
</div>
